<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogo · Cantiere Nottambuli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="wrap"><a class="logo" href="index.html">Cantiere Nottambuli</a><nav aria-label="Menu principale"><a href="chi-siamo.html">Chi siamo</a><a href="attivita.html">Attività</a><a href="associarsi.html">Associarsi</a><a href="catalogo.html" aria-current="page">Catalogo</a><a href="contatti.html">Contatti</a></nav></div></header>
<div class="nastro" aria-hidden="true"></div>
<main><div class="wrap"><h1>Catalogo</h1>
<p>Scegli gli indumenti che vuoi, indica taglia e quantità e invia la richiesta. Il pagamento è a offerta libera.</p>
<form id="ordine-form" action="https://formsubmit.co/cantierenottambuli1@gmail.com" method="POST">
<ul class="eventi" id="capi"></ul>
<label class="campo">Nome e cognome <input type="text" name="nome" required></label>
<label class="campo">La tua email <input type="email" name="email" required></label>
<label class="campo">Note (facoltative) <textarea name="note" rows="3"></textarea></label>
<input type="hidden" name="ordine" id="ordine">
<input type="hidden" name="_subject" value="Nuova richiesta dal catalogo">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://cantierenottambuli.github.io/grazie.html">
<input type="hidden" name="_autoresponse" value="Ciao! Abbiamo ricevuto la tua richiesta dal catalogo di Cantiere Nottambuli. Ti contatteremo presto per accordarci sul ritiro. Il pagamento è a offerta libera. Grazie!">
<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
<button class="btn" type="submit">Invia la richiesta</button></form></div></main>
<footer><div class="wrap">© 2026 Cantiere Nottambuli · [Codice fiscale / dati associazione]</div></footer><script>
const CAPI=[
 {id:"tshirt",nome:"T-shirt",desc:"Cotone, logo Cantiere Nottambuli",taglie:["S","M","L","XL"]},
 {id:"felpa",nome:"Felpa",desc:"Con cappuccio",taglie:["S","M","L","XL"]},
 {id:"cappellino",nome:"Cappellino",desc:"Taglia unica",taglie:["Unica"]},
 {id:"borsa",nome:"Borsa in tela",desc:"Taglia unica",taglie:["Unica"]}
];
const lista=document.getElementById("capi");
CAPI.forEach(c=>{const li=document.createElement("li");li.className="capo";
 li.innerHTML=`<div><strong>${c.nome}</strong>${c.desc}</div>
 <label>Taglia <select id="t-${c.id}">${c.taglie.map(t=>`<option>${t}</option>`).join("")}</select></label>
 <label>Quantità <input type="number" id="q-${c.id}" min="0" max="20" value="0"></label>`;lista.appendChild(li);});
document.getElementById("ordine-form").addEventListener("submit",e=>{
 const righe=CAPI.filter(c=>+document.getElementById("q-"+c.id).value>0)
  .map(c=>`${document.getElementById("q-"+c.id).value} x ${c.nome} (taglia ${document.getElementById("t-"+c.id).value})`);
 if(!righe.length){e.preventDefault();alert("Scegli almeno un capo (quantità maggiore di 0).");return;}
 document.getElementById("ordine").value=righe.join(" | ");});
</script></body></html>
